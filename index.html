<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网络疑病症 - 周一：AI健康助手的边界</title>
    <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --dialogue-bg: rgba(20, 20, 30, 0.85);
      --dialogue-border: rgba(255, 255, 255, 0.12);
      --text-primary: #f5f0e8;
      --text-secondary: #c8c0b0;
      --accent: #e8c56d;
      --accent-hover: #f0d48a;
      --btn-bg: rgba(40, 40, 55, 0.9);
      --btn-hover: rgba(60, 60, 80, 0.95);
      --btn-border: rgba(232, 197, 109, 0.3);
      --portrait-border: rgba(232, 197, 109, 0.2);
    }

    @font-face {
      font-family: 'VN-Font';
      src: local('Microsoft YaHei'), local('PingFang SC'), local('Noto Sans SC'), local('Hiragino Sans GB');
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'VN-Font', sans-serif;
      background: #0a0a0f;
      color: var(--text-primary);
    }

    #game {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* Background Layer */
    .bg-layer {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: opacity 0.8s ease-in-out;
      opacity: 0;
      will-change: opacity;
    }

    .bg-layer.active {
      opacity: 1;
    }

    /* Character Portrait */
    .portrait-layer {
      position: absolute;
      bottom: 140px;
      right: 4%;
      max-height: 65vh;
      max-width: 35vw;
      opacity: 0;
      transform: translateY(30px) scale(0.95);
      transition: opacity 0.5s ease-out, transform 0.5s ease-out;
      pointer-events: none;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.4));
      border-radius: 4px;
      border: 1px solid var(--portrait-border);
    }

    .portrait-layer.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Dialogue Box */
    .dialogue-box {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 960px;
      min-height: 160px;
      padding: 24px 32px;
      background: var(--dialogue-bg);
      backdrop-filter: blur(20px) saturate(120%);
      -webkit-backdrop-filter: blur(20px) saturate(120%);
      border-top: 1px solid var(--dialogue-border);
      border-radius: 16px 16px 0 0;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.5),
                  inset 0 1px 0 rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      gap: 10px;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .dialogue-box:hover {
      transform: translateX(-50%) translateY(-2px);
      box-shadow: 0 -15px 50px rgba(0,0,0,0.6),
                  inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .dialogue-box.hidden {
      display: none;
    }

    .dialogue-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .dialogue-text {
      font-size: 17px;
      line-height: 1.85;
      color: var(--text-primary);
      letter-spacing: 0.02em;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .dialogue-text .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 1.2em;
      background: var(--accent);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    .dialogue-hint {
      position: absolute;
      bottom: 14px;
      right: 20px;
      font-size: 12px;
      color: var(--text-secondary);
      opacity: 0.5;
      animation: pulse 2s infinite;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }

    .dialogue-hint::before {
      content: '';
      width: 6px;
      height: 6px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg);
      animation: bounce 1s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: rotate(45deg) translate(0, 0); }
      50% { transform: rotate(45deg) translate(4px, 4px); }
    }

    /* Options Container */
    .options-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 85%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .options-container.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .option-btn {
      padding: 18px 24px;
      background: var(--btn-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--btn-border);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 16px;
      line-height: 1.6;
      text-align: left;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .option-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(232, 197, 109, 0.08), transparent);
      transform: translateX(-100%);
      transition: transform 0.5s ease;
    }

    .option-btn:hover {
      background: var(--btn-hover);
      border-color: var(--accent);
      transform: translateX(8px);
      box-shadow: 0 8px 30px rgba(232, 197, 109, 0.15);
    }

    .option-btn:hover::before {
      transform: translateX(100%);
    }

    .option-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .option-btn.correct {
      border-color: #4ade80;
      background: rgba(34, 80, 50, 0.4);
    }

    .option-btn.incorrect {
      border-color: #f87171;
      background: rgba(80, 34, 34, 0.4);
    }

    /* Accordion (Knowledge Card W1-06) */
    .knowledge-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      width: 90%;
      max-width: 720px;
      max-height: 85vh;
      background: rgba(18, 18, 28, 0.95);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--dialogue-border);
      border-radius: 20px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6),
                  inset 0 1px 0 rgba(255,255,255,0.05);
      overflow: hidden;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
      display: flex;
      flex-direction: column;
    }

    .knowledge-card.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .knowledge-header {
      padding: 28px 32px;
      border-bottom: 1px solid var(--dialogue-border);
      background: linear-gradient(180deg, rgba(232, 197, 109, 0.08), transparent);
    }

    .knowledge-title {
      font-size: 22px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.02em;
      margin-bottom: 6px;
    }

    .knowledge-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .accordion-list {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .accordion-item {
      border: 1px solid var(--btn-border);
      border-radius: 12px;
      background: var(--btn-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .accordion-item.open {
      border-color: var(--accent);
      box-shadow: 0 4px 20px rgba(232, 197, 109, 0.1);
    }

    .accordion-header {
      width: 100%;
      padding: 18px 24px;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: background 0.2s ease;
    }

    .accordion-header:hover {
      background: rgba(232, 197, 109, 0.05);
    }

    .accordion-header:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .accordion-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      transition: transform 0.3s ease;
      flex-shrink: 0;
    }

    .accordion-item.open .accordion-icon {
      transform: rotate(180deg);
    }

    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease-out, padding 0.3s ease;
    }

    .accordion-item.open .accordion-content {
      max-height: 500px;
      padding-bottom: 20px;
    }

    .accordion-text {
      padding: 0 24px 8px;
      font-size: 15px;
      line-height: 1.8;
      color: var(--text-secondary);
      white-space: pre-wrap;
    }

    .knowledge-continue {
      padding: 20px 32px;
      border-top: 1px solid var(--dialogue-border);
      display: flex;
      justify-content: center;
    }

    .continue-btn {
      padding: 14px 48px;
      background: linear-gradient(135deg, var(--accent), #d4a850);
      border: none;
      border-radius: 50px;
      color: #1a1510;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 20px rgba(232, 197, 109, 0.3);
    }

    .continue-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(232, 197, 109, 0.45);
    }

    .continue-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* Feedback Modal - prominent right/wrong popup */
    .feedback-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 85%;
      max-width: 480px;
      background: rgba(18, 18, 28, 0.98);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 2px solid var(--dialogue-border);
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 30px 80px rgba(0,0,0,0.7);
    }

    .feedback-modal.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .feedback-modal .feedback-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: iconPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
    }

    .feedback-modal .feedback-icon svg {
      width: 48px;
      height: 48px;
    }

    .feedback-modal.correct .feedback-icon {
      background: linear-gradient(135deg, rgba(74, 222, 128, 0.25), rgba(34, 80, 50, 0.4));
      box-shadow: 0 0 40px rgba(74, 222, 128, 0.3);
    }

    .feedback-modal.correct .feedback-icon svg {
      color: #4ade80;
    }

    .feedback-modal.incorrect .feedback-icon {
      background: linear-gradient(135deg, rgba(248, 113, 113, 0.25), rgba(80, 34, 34, 0.4));
      box-shadow: 0 0 40px rgba(248, 113, 113, 0.3);
    }

    .feedback-modal.incorrect .feedback-icon svg {
      color: #f87171;
    }

    .feedback-modal .feedback-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: 0.04em;
    }

    .feedback-modal.correct .feedback-title {
      color: #4ade80;
    }

    .feedback-modal.incorrect .feedback-title {
      color: #f87171;
    }

    .feedback-modal .feedback-desc {
      font-size: 16px;
      line-height: 1.8;
      color: var(--text-secondary);
      margin-bottom: 28px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .feedback-modal .feedback-btn {
      padding: 14px 48px;
      background: linear-gradient(135deg, var(--accent), #d4a850);
      border: none;
      border-radius: 50px;
      color: #1a1510;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 20px rgba(232, 197, 109, 0.3);
    }

    .feedback-modal .feedback-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(232, 197, 109, 0.45);
    }

    .feedback-modal .feedback-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    @keyframes iconPop {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Summary Card (W1-09) */
    .summary-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      width: 85%;
      max-width: 600px;
      background: rgba(18, 18, 28, 0.95);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--dialogue-border);
      border-radius: 24px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6),
                  inset 0 1px 0 rgba(255,255,255,0.05);
      padding: 48px 40px;
      text-align: center;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .summary-card.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .summary-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      color: var(--accent);
    }

    .summary-text {
      font-size: 20px;
      line-height: 1.7;
      color: var(--text-primary);
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    .summary-continue {
      margin-top: 32px;
    }

    /* Loading Screen */
    #loading {
      position: fixed;
      inset: 0;
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #loading.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(232, 197, 109, 0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 20px;
      font-size: 15px;
      color: var(--text-secondary);
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .dialogue-box {
        width: 100%;
        border-radius: 0;
        min-height: 140px;
        padding: 20px 20px 40px;
      }

      .portrait-layer {
        max-height: 40vh;
        max-width: 60vw;
        right: 5%;
        bottom: 130px;
      }

      .options-container {
        width: 95%;
      }

      .option-btn {
        padding: 16px 20px;
        font-size: 15px;
      }

      .knowledge-card, .summary-card {
        width: 95%;
        padding: 24px 20px;
      }

      .knowledge-header {
        padding: 20px 20px;
      }

      .accordion-header {
        padding: 16px 20px;
        font-size: 15px;
      }

      .accordion-text {
        padding: 0 20px 16px;
        font-size: 14px;
      }

      .summary-text {
        font-size: 17px;
      }
    }

    @media (max-width: 480px) {
      .dialogue-text {
        font-size: 15px;
      }

      .option-btn {
        font-size: 14px;
        padding: 14px 18px;
      }

      .knowledge-title {
        font-size: 18px;
      }

      .summary-text {
        font-size: 16px;
      }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">正在加载剧本...</div>
  </div>

  <div id="game">
    <!-- Background Layers -->
    <div class="bg-layer" id="bg-current"></div>
    <div class="bg-layer" id="bg-next"></div>

    <!-- Character Portrait -->
    <img class="portrait-layer" id="portrait" src="" alt="角色立绘">

    <!-- Dialogue Box -->
    <div class="dialogue-box" id="dialogueBox">
      <div class="dialogue-name" id="dialogueName"></div>
      <div class="dialogue-text" id="dialogueText"></div>
      <div class="dialogue-hint" id="dialogueHint">点击继续</div>
    </div>

    <!-- Options Container -->
    <div class="options-container" id="optionsContainer"></div>

    <!-- Knowledge Card (W1-06) -->
    <div class="knowledge-card" id="knowledgeCard">
      <div class="knowledge-header">
        <div class="knowledge-title">AI 健康助手的三条底线</div>
        <div class="knowledge-subtitle">点击展开查看详细解释</div>
      </div>
      <div class="accordion-list" id="accordionList"></div>
      <div class="knowledge-continue">
        <button class="continue-btn" id="knowledgeContinue">继续</button>
      </div>
    </div>

    <!-- Summary Card (W1-09) -->
    <div class="summary-card" id="summaryCard">
      <svg class="summary-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
        <path d="M12 6v6l4 2"/>
      </svg>
      <div class="summary-text" id="summaryText"></div>
      <div class="summary-continue">
        <button class="continue-btn" id="summaryContinue">下一关</button>
      </div>
    </div>

    <!-- Feedback Modal -->
    <div class="feedback-modal" id="feedbackModal">
      <div class="feedback-icon">
        <svg id="feedbackModalIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></svg>
      </div>
      <div class="feedback-title" id="feedbackModalTitle"></div>
      <div class="feedback-desc" id="feedbackModalDesc"></div>
      <button class="feedback-btn" id="feedbackModalBtn">知道了</button>
    </div>
  <!-- Background Music -->
    <audio id="bgMusic" src="背景音.mp3" loop preload="auto"></audio>
    <!-- Click Sound Effect -->
    <audio id="clickSound" src="点击音效.flac" preload="auto"></audio>
  </div>

        "feedback_selected": null,
        "feedback_explanation": "W1-04",
        "next_node": "W1-04",
        "notes": "公开案例改写",

    // ==================== UTILITIES ====================
    function getBgKey(scene) {
      if (!scene) return '卧室夜景';
      for (const [key, value] of Object.entries(BG_MAP)) {
        if (scene.includes(key)) return key;
      }
      return '卧室夜景';
    }

    function getBgUrl(scene) {
      const key = getBgKey(scene);
      return BG_MAP[key] || BG_MAP['卧室夜景'];
    }

    function preloadImage(url) {
      if (preloadedImages.has(url)) return preloadedImages.get(url);
      const promise = new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = url;
      });
      preloadedImages.set(url, promise);
      return promise;
    }

    function preloadNodeImages(nodeIndex) {
      const node = NODES[nodeIndex];
      if (!node) return Promise.resolve();
      const urls = [getBgUrl(node.scene), PORTRAIT_MAP[node.id]].filter(Boolean);
      return Promise.all(urls.map(preloadImage));
    }

    // ==================== TYPING EFFECT ====================
    let typingResolve = null;
    let typingCallback = null;

    function typeText(element, text, speed = 28, callback) {
      return new Promise((resolve) => {
        isTyping = true;
        currentTypingText = text;
        currentTypingIndex = 0;
        typingResolve = resolve;
        typingCallback = callback;
        element.innerHTML = '';

        function type() {
          if (currentTypingIndex < currentTypingText.length) {
            element.textContent += currentTypingText[currentTypingIndex];
            currentTypingIndex++;
            typingTimer = setTimeout(type, speed);
          } else {
            isTyping = false;
            element.innerHTML = text; // Remove cursor
            typingResolve = null;
            typingCallback = null;
            if (callback) callback();
            resolve();
          }
        }
        type();
      });
    }

    function skipTyping() {
      if (isTyping) {
        if (typingTimer) clearTimeout(typingTimer);
        dialogueText.innerHTML = currentTypingText;
        isTyping = false;
        if (typingCallback) {
          typingCallback();
          typingCallback = null;
        }
        if (typingResolve) {
          typingResolve();
          typingResolve = null;
        }
      }
    }

      const isFullyCorrect = selectedSet.size === correctAnswers.size && 
        [...selectedSet].every(idx => correctAnswers.has(idx));
      
      // Disable all checkboxes
      const checkboxes = optionsContainer.querySelectorAll('input[type="checkbox"]');
      checkboxes.forEach(cb => cb.disabled = true);
      
      // Disable submit button
      const submitBtn = optionsContainer.querySelector('.continue-btn');
      if (submitBtn) submitBtn.disabled = true;
      
      // Show correct/incorrect styling on labels
      const labels = optionsContainer.querySelectorAll('.option-btn');
      labels.forEach((label, idx) => {
        const isCorrectOption = correctAnswers.has(idx);
        const isSelected = selectedSet.has(idx);
        
        if (isSelected) {
          if (isCorrectOption) {
            label.classList.add('correct');
          } else {
            label.classList.add('incorrect');
          }
        } else if (isCorrectOption) {
          // Show missed correct answers
          label.style.borderColor = 'var(--accent)';
          label.style.background = 'rgba(232, 197, 109, 0.1)';
        }
      });

      // Show feedback after delay
      setTimeout(() => {
        optionsContainer.classList.remove('visible');
        isOptionsMode = false;
        showMultiSelectFeedback(node, isFullyCorrect);
      }, 1000);
    }

    function showMultiSelectFeedback(node, isCorrect) {
      feedbackNodeId = node.id;
      feedbackIsCorrect = isCorrect;
      feedbackStep = 1;

      let title = '';
      let desc = '';

      if (node.id === 'W1-05') {
        if (isCorrect) {
          title = '回答正确！';
          desc = '查体、地方指引、担责，它都做不到。';
        } else {
          title = '回答错误';
          desc = '它最擅长的恰恰是把话说通顺——通顺不等于可靠。';
        }
      } else {
        title = isCorrect ? '回答正确！' : '回答错误';
        desc = node.feedback_explanation || '';
      }

      showFeedbackModal(isCorrect, title, desc);
    }

    function showFeedback(node, isCorrect, selectedLetter) {
      let feedbackText = '';

      if (node.id === 'W1-02') {
        feedbackText = node.feedback_explanation || '没有对错，只是记下你的选择。';
      } else if (node.id === 'W1-08') {
        feedbackText = node.feedback_explanation || '';
      } else {
        feedbackText = node.feedback_explanation || '';
      }

      if (feedbackText) {
        waitingForClick = false;
        dialogueHint.style.display = 'none';
        typeText(dialogueText, feedbackText, 22, () => {
          waitingForClick = true;
          dialogueHint.style.display = 'flex';
        });
      } else {
        // No feedback, proceed to next node
        setTimeout(() => goToNextNode(node), 500);
      }
    }

    async function showKnowledgeCard() {
      isKnowledgeCardMode = true;
      dialogueBox.classList.add('hidden');
      portrait.classList.remove('visible');

      // Build accordion items
      accordionList.innerHTML = '';
      ACCORDION_DATA.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'accordion-item';
        div.innerHTML = `
          <button class="accordion-header" data-index="${idx}">
            <span>${item.title}</span>
            <svg class="accordion-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="accordion-content">
            <div class="accordion-text">${item.content}</div>
          </div>
        `;
        const header = div.querySelector('.accordion-header');
        header.addEventListener('click', () => {
          playClickSound();
          toggleAccordion(div);
        });
        accordionList.appendChild(div);
      });

      knowledgeCard.classList.add('visible');

      knowledgeContinue.onclick = () => {
        playClickSound();
        knowledgeCard.classList.remove('visible');
        goToNextNode(NODES[currentNodeIndex]);
      };
    }

    function toggleAccordion(item) {
      const isOpen = item.classList.toggle('open');
      // Close others
      document.querySelectorAll('.accordion-item').forEach(other => {
        if (other !== item) other.classList.remove('open');
      });
    }

    async function showSummaryCard(text) {
      isSummaryMode = true;
      dialogueBox.classList.add('hidden');
      portrait.classList.remove('visible');

      summaryText.textContent = text;
      summaryCard.classList.add('visible');

      summaryContinue.onclick = () => {
        playClickSound();
        summaryCard.classList.remove('visible');
        goToNextNode(NODES[currentNodeIndex]);
      };
    }

    function hideAllSpecialUI() {
      optionsContainer.classList.remove('visible');
      knowledgeCard.classList.remove('visible');
      summaryCard.classList.remove('visible');
      feedbackModal.classList.remove('visible');
      dialogueBox.classList.remove('hidden');
    }

    function goToNextNode(node) {
      const nextId = node.next_node;
      if (!nextId || nextId === '（进入 W2）' || nextId === '串联下一关') {
        // End of game
        showEnding();
        return;
      }

      const nextIndex = NODES.findIndex(n => n.id === nextId);
      if (nextIndex !== -1) {
        showNode(nextIndex);
      } else {
        console.warn('Next node not found:', nextId);
        showEnding();
      }
    }

    function showEnding() {
      dialogueBox.classList.add('hidden');
      portrait.classList.remove('visible');
      setBackground('图片/卧室夜景.webp', true);

      const endingCard = document.createElement('div');
      endingCard.style.cssText = `
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        text-align: center; padding: 40px; max-width: 500px;
        background: rgba(18,18,28,0.95); backdrop-filter: blur(25px);
        border: 1px solid var(--dialogue-border); border-radius: 24px;
        box-shadow: 0 30px 80px rgba(0,0,0,0.6); z-index: 50;
      `;
      endingCard.innerHTML = `
        <h2 style="color: var(--accent); margin-bottom: 16px; font-size: 24px;">第 一 周 完</h2>
        <p style="color: var(--text-secondary); line-height: 1.8; margin-bottom: 24px;">
          你学会了在 AI 面前保留判断权。<br>
          下一关：为什么它听起来那么懂你？
        </p>
        <button class="continue-btn" onclick="location.reload()">重新开始</button>
      `;
      document.getElementById('game').appendChild(endingCard);
    }

    // ==================== EVENT HANDLERS ====================
    function handleDialogueClick() {
      if (isTyping) {
        skipTyping();
        return;
      }
      
      // Handle two-step feedback flow: step 2 = next-step text in dialogue box
      if (feedbackStep === 2) {
        feedbackStep = 0;
        feedbackNodeId = null;
        waitingForClick = false;
        dialogueHint.style.display = 'none';
        goToNextNode(NODES[currentNodeIndex]);
        return;
      }
      
      if (waitingForClick && !isOptionsMode && !isKnowledgeCardMode && !isSummaryMode) {
        waitingForClick = false;
        dialogueHint.style.display = 'none';
        goToNextNode(NODES[currentNodeIndex]);
      }
    }

    function handleKeyDown(e) {
      if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') {
        e.preventDefault();
        handleDialogueClick();
      }
      if (e.key === 'Escape') {
        if (isKnowledgeCardMode) {
          knowledgeCard.classList.remove('visible');
          goToNextNode(NODES[currentNodeIndex]);
        } else if (isSummaryMode) {
          summaryCard.classList.remove('visible');
          goToNextNode(NODES[currentNodeIndex]);
        }
      }
    }

    // ==================== INIT ====================
    async function init() {
      await preloadNodeImages(0);
      loading.classList.add('hidden');
      showNode(0);
      // Start background music after first user interaction
      document.addEventListener('click', startBgMusic, { once: true });
      document.addEventListener('keydown', startBgMusic, { once: true });
    }

    // Click anywhere on game screen to advance (typical VN behavior)
    document.getElementById('game').addEventListener('click', (e) => {
      // Ignore clicks on interactive elements
      if (e.target.closest('.option-btn, .accordion-header, .continue-btn, .feedback-btn')) return;
      playClickSound();
      handleDialogueClick();
    });
    document.addEventListener('keydown', handleKeyDown);

    // Touch support for mobile
    let touchStartY = 0;
    document.getElementById('game').addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    document.getElementById('game').addEventListener('touchend', (e) => {
      const touchEndY = e.changedTouches[0].clientY;
      if (Math.abs(touchEndY - touchStartY) < 20) {
        handleDialogueClick();
      }
    });

    // Start
    init();
  </script>
</body>
</html>
